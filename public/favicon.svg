<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Unified Gradient Across All Symbols -->
    <linearGradient id="codeUnifiedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Subtle Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base with Dark Slate Background -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)"/>

  <!-- Glowing Border -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="none" stroke="url(#borderGrad)" stroke-width="12" stroke-opacity="0.75"/>

  <!-- Code Symbols (Crisp & High-Contrast Development Theme) -->
  <g stroke="url(#codeUnifiedGrad)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 175 160 L 95 256 L 175 352" fill="none" stroke-width="48"/>
    <path d="M 290 135 L 222 377" fill="none" stroke-width="46"/>
    <path d="M 337 160 L 417 256 L 337 352" fill="none" stroke-width="48"/>
  </g>
</svg>
